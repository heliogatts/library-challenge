services:
  library-db:
    image: postgres:17-alpine
    container_name: library-db
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: librarydb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - library-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d librarydb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  library-api:
    build:
      context: ./src/LibraryApi
      dockerfile: Dockerfile
    container_name: library-api
    restart: unless-stopped
    secrets:
      - db_password
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:80
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      library-db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M

  library-web:
    build:
      context: ./src/library-web
      dockerfile: Dockerfile
    container_name: library-web
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - library-api
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  library-data:
    name: library-challenge-data
